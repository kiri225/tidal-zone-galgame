<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="潮间带">
  <defs>
    <linearGradient id="sky" x1="32" y1="4" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a2a44"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
    <linearGradient id="sea" x1="8" y1="28" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e4d6b"/>
      <stop offset="0.55" stop-color="#163a52"/>
      <stop offset="1" stop-color="#0e2436"/>
    </linearGradient>
    <linearGradient id="amber" x1="40" y1="10" x2="52" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0c27a"/>
      <stop offset="1" stop-color="#d4a056"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <!-- moon / lamp -->
  <circle cx="46" cy="16" r="6.5" fill="url(#amber)" opacity="0.95"/>
  <circle cx="49" cy="14" r="6.5" fill="#0b1524" opacity="0.55"/>
  <!-- tide band -->
  <path fill="url(#sea)" d="M0 34c8 4 14 2 22-1s14-4 20-1 12 6 22 3v29H0V34z"/>
  <!-- foam line -->
  <path fill="none" stroke="#c9e6f0" stroke-width="2" stroke-linecap="round" opacity="0.75"
        d="M4 38c7 3 12 1 18-1.5S34 32 40 35s11 5 20 2"/>
  <!-- reef / intertidal mark -->
  <path fill="#8a9aab" opacity="0.85" d="M18 50l4-7 4 3 3-5 4 9H18z"/>
  <path fill="#c9a46c" opacity="0.7" d="M38 52l3-5 3 2 2-4 3 7H38z"/>
</svg>
